name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp target/release/hirara-monitor "hirara-monitor-${version}-x86_64-linux"
          sha256sum "hirara-monitor-${version}-x86_64-linux" > "sha256sums-${version}.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          files: |
            hirara-monitor-*-x86_64-linux
            sha256sums-*.txt
