name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Package
        run: |
          sha=$(git rev-parse --short HEAD)
          cp target/release/hirara-monitor "hirara-monitor-${sha}-x86_64-linux"
          sha256sum "hirara-monitor-${sha}-x86_64-linux" > "sha256sums-${sha}.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "main-${{ github.sha }}"
          name: "Build ${{ github.sha }}"
          prerelease: true
          files: |
            hirara-monitor-*-x86_64-linux
            sha256sums-*.txt
