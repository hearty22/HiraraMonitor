[package]
name = "hirara-monitor"
version = "0.3.0"
edition = "2021"
description = "Native desktop system monitor built with Rust and egui"
license = "MIT"
authors = ["F.E.Esclnt"]
keywords = ["system-monitor", "egui", "rust", "linux", "performance"]
categories = ["visualization", "command-line-utilities"]

[dependencies]
eframe = "0.28"
egui = "0.28"
egui_plot = "0.28"
sysinfo = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
env_logger = "0.11"
log = "0.4"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }