[package]
name = "hirara-monitor"
version = "0.3.0"
edition = "2021"
description = "Native desktop system monitor built with Rust and egui"
license = "MIT"
authors = ["F.E.Esclnt"]
keywords = ["system-monitor", "egui", "rust", "linux", "performance"]
categories = ["visualization", "command-line-utilities"]

[dependencies]
eframe = "0.28"
egui = "0.28"
egui_plot = "0.28"
sysinfo = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
env_logger = "0.11"
log = "0.4"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }

[features]
default = ["system-tray"]
system-tray = ["dep:tray-icon", "dep:image", "dep:gtk"]

[dependencies.tray-icon]
version = "0.26"
optional = true
features = ["ksni"]

[dependencies.image]
version = "0.25"
optional = true
default-features = false
features = ["png"]

[dependencies.gtk]
version = "0.18"
optional = true
features = ["v3_24"]
[dev-dependencies]
x11-dl = "2.21"
